<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>立绘与头像制作</title>
<style>
:root{--bg:#14172b;--panel:#202544;--panel2:#181c34;--line:#39436b;--text:#f3f5ff;--muted:#a5aecf;--gold:#e0bc58;--cyan:#55d7d2;--danger:#ff777f}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#111426,#1a1d34);color:var(--text);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;min-height:100vh}.wrap{max-width:1280px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:14px}.head h1{font-size:22px;margin:0}.head p{margin:4px 0 0;color:var(--muted)}.steps{display:flex;gap:8px}.step{padding:7px 13px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.step.active{border-color:var(--gold);color:var(--gold);background:#e0bc5815}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.card{background:rgba(30,35,64,.96);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 14px 40px #0004}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.btn,.file-label{border:1px solid var(--line);background:#293052;color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}.btn:hover,.file-label:hover{border-color:#7181bd}.btn.active,.btn.primary{background:#c8a43f;color:#17182a;border-color:#e5c963;font-weight:700}.btn.sampling{outline:2px solid #55d7d2;box-shadow:0 0 0 4px #55d7d226}.btn.cyan{background:var(--cyan);color:#101628;border-color:var(--cyan);font-weight:700}.btn:disabled{opacity:.4;cursor:not-allowed}.file-label input{display:none}.canvas-shell{position:relative;min-height:560px;display:grid;place-items:center;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:16px;background-color:#161a30;background-image:linear-gradient(45deg,#252a47 25%,transparent 25%),linear-gradient(-45deg,#252a47 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#252a47 75%),linear-gradient(-45deg,transparent 75%,#252a47 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}canvas{max-width:100%;height:auto;display:block;box-shadow:0 8px 32px #0008;cursor:crosshair}.hint{color:var(--muted);font-size:12px}.controls{display:grid;gap:10px;margin-top:12px}.control{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center}.control input[type=range]{width:100%}.keyer{margin-top:12px;padding:12px;border:1px solid #5368a5;border-radius:10px;background:#5368a516}.keyer-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.swatch{width:24px;height:24px;border:1px solid #fff6;border-radius:6px;display:inline-block;vertical-align:middle}.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;overflow:hidden}.preview-box{height:220px;display:grid;place-items:center;border-radius:9px;overflow:hidden;background-color:#161a30;background-image:linear-gradient(45deg,#252a47 25%,transparent 25%),linear-gradient(-45deg,#252a47 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#252a47 75%),linear-gradient(-45deg,transparent 75%,#252a47 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}.preview img{max-width:100%;max-height:100%;object-fit:contain}.preview.avatar .preview-box{border-radius:50%;height:140px;width:140px;margin:auto}.preview small{display:block;color:var(--muted);margin-top:7px}.side h3{margin:0 0 10px}.summary{display:grid;gap:8px;margin:14px 0}.summary div{display:flex;justify-content:space-between;border-bottom:1px dashed #40496d;padding-bottom:7px}.message{min-height:24px;color:#86e2a2;margin-top:8px}.footer{display:flex;gap:8px;margin-top:12px}.mobile-next{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.canvas-shell{min-height:420px}.mobile-next{display:inline-flex}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><h1>立绘与头像制作</h1><p>一张原图依次生成 3:4 垂直立绘与圆形头像；透明像素会完整保留。</p></div><div class="steps"><span class="step active" data-step="1">1 原图</span><span class="step" data-step="2">2 立绘</span><span class="step" data-step="3">3 头像</span></div></div>
  <div class="layout">
    <section class="card">
      <div class="tools">
        <label class="file-label">选择原始图片<input id="file" type="file" accept="image/*"></label>
        <button class="btn active" data-mode="portrait">截取立绘 3:4</button>
        <button class="btn" data-mode="avatar">截取圆形头像</button>
        <button class="btn" id="center">居中选区</button>
        <span class="hint" id="source-hint">拖动选区，滚轮或滑杆缩放</span>
      </div>
      <div class="canvas-shell"><canvas id="canvas" width="720" height="540"></canvas></div>
      <div class="controls">
        <label class="control"><span>选区尺寸</span><input id="size" type="range" min="15" max="100" value="72"><output id="size-val">72%</output></label>
      </div>
      <div class="keyer">
        <div class="keyer-head"><label><input id="remove-bg" type="checkbox"> 启用背景色抠除</label><span><button class="btn" id="sample-btn" type="button">吸管取色</button> <i class="swatch" id="swatch"></i> <span id="sample-text" class="hint">点击吸管后，再点画面取色</span></span></div>
        <label class="control" style="margin-top:10px"><span>颜色容差</span><input id="tolerance" type="range" min="0" max="120" value="34"><output id="tol-val">34</output></label>
        <label class="control"><span>边缘柔化</span><input id="feather" type="range" min="0" max="80" value="18"><output id="feather-val">18</output></label>
      </div>
    </section>
    <aside class="card side">
      <h3>素材结果</h3>
      <div class="preview-grid">
        <div class="preview"><div class="preview-box" id="portrait-preview"><span class="hint">尚未载入</span></div><small>立绘 · 768×1024 PNG</small></div>
        <div class="preview avatar"><div class="preview-box" id="avatar-preview"><span class="hint">尚未载入</span></div><small>头像 · 256×256 PNG</small></div>
      </div>
      <div class="summary"><div><span>立绘比例</span><b>3:4 垂直</b></div><div><span>头像形状</span><b>圆形透明 PNG</b></div><div><span>背景处理</span><b id="bg-state">保留原始透明</b></div></div>
      <button class="btn primary mobile-next" id="next">下一步</button>
      <div class="footer"><button class="btn cyan" id="save" disabled>保存到角色卡</button><button class="btn" id="close">关闭</button></div>
      <div class="message" id="message"></div>
    </aside>
  </div>
</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
var base=document.createElement('canvas'),bctx=base.getContext('2d',{willReadFrequently:true});
var img=null,mode='portrait',drag=false,offX=0,offY=0,sample=null,sampling=false;
var selections={portrait:{x:0,y:0,w:300,h:400},avatar:{x:0,y:0,r:120}};
var assets={portrait:'',avatar:'',avatarFramed:''};
var sizeInput=document.getElementById('size');
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function point(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};}
function updateSteps(){document.querySelectorAll('.step').forEach(function(s){var n=+s.dataset.step;s.classList.toggle('active',n===1&&!img||n===2&&mode==='portrait'||n===3&&mode==='avatar');});}
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(function(b){b.classList.toggle('active',b.dataset.mode===m);});sizeInput.value=m==='portrait'?Math.round(selections.portrait.w/canvas.width*100):Math.round(selections.avatar.r*2/Math.min(canvas.width,canvas.height)*100);document.getElementById('size-val').value=sizeInput.value+'%';updateSteps();draw();}
function setImage(image){img=image;var scale=Math.min(900/image.width,650/image.height,1);canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));base.width=canvas.width;base.height=canvas.height;bctx.clearRect(0,0,base.width,base.height);bctx.drawImage(image,0,0,base.width,base.height);var pw=Math.min(canvas.width*.62,canvas.height*.72*3/4);selections.portrait={x:(canvas.width-pw)/2,y:(canvas.height-pw*4/3)/2,w:pw,h:pw*4/3};var rr=Math.min(canvas.width,canvas.height)*.25;selections.avatar={x:canvas.width/2,y:canvas.height/2,r:rr};sample=null;sampling=false;document.getElementById('sample-btn').classList.remove('sampling');document.getElementById('source-hint').textContent='原图 '+image.naturalWidth+'×'+image.naturalHeight+'；拖动选区调整构图';document.getElementById('save').disabled=false;setMode('portrait');updatePreviews();}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(!img){ctx.fillStyle='#9aa4c8';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='16px system-ui';ctx.fillText('请选择原始图片',canvas.width/2,canvas.height/2);return;}ctx.drawImage(base,0,0);ctx.save();ctx.fillStyle='rgba(7,9,20,.56)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.globalCompositeOperation='destination-out';if(mode==='portrait'){var s=selections.portrait;ctx.fillRect(s.x,s.y,s.w,s.h);}else{var a=selections.avatar;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fill();}ctx.restore();ctx.save();ctx.strokeStyle='#f1c95f';ctx.lineWidth=3;ctx.setLineDash([8,5]);if(mode==='portrait'){var p=selections.portrait;ctx.strokeRect(p.x,p.y,p.w,p.h);}else{var av=selections.avatar;ctx.beginPath();ctx.arc(av.x,av.y,av.r,0,Math.PI*2);ctx.stroke();}ctx.restore();}
function centerSelection(){if(mode==='portrait'){var p=selections.portrait;p.x=(canvas.width-p.w)/2;p.y=(canvas.height-p.h)/2;}else{selections.avatar.x=canvas.width/2;selections.avatar.y=canvas.height/2;}draw();updatePreviews();}
function applyKey(canvasOut){if(!document.getElementById('remove-bg').checked||!sample)return;var c=canvasOut.getContext('2d',{willReadFrequently:true}),im=c.getImageData(0,0,canvasOut.width,canvasOut.height),d=im.data,t=+document.getElementById('tolerance').value,f=Math.max(1,+document.getElementById('feather').value);for(var i=0;i<d.length;i+=4){if(d[i+3]===0)continue;var dist=Math.sqrt((d[i]-sample.r)**2+(d[i+1]-sample.g)**2+(d[i+2]-sample.b)**2);if(dist<=t)d[i+3]=0;else if(dist<t+f)d[i+3]=Math.round(d[i+3]*(dist-t)/f);}c.putImageData(im,0,0);}
function cropPortrait(){var s=selections.portrait,o=document.createElement('canvas');o.width=768;o.height=1024;var c=o.getContext('2d');c.clearRect(0,0,o.width,o.height);c.drawImage(base,s.x,s.y,s.w,s.h,0,0,o.width,o.height);applyKey(o);return o;}
function cropAvatar(){var s=selections.avatar,o=document.createElement('canvas');o.width=256;o.height=256;var c=o.getContext('2d');c.clearRect(0,0,256,256);c.save();c.beginPath();c.arc(128,128,128,0,Math.PI*2);c.clip();c.drawImage(base,s.x-s.r,s.y-s.r,s.r*2,s.r*2,0,0,256,256);c.restore();applyKey(o);return o;}
function updatePreviews(){if(!img)return;var pc=cropPortrait(),ac=cropAvatar();assets.portrait=pc.toDataURL('image/png');assets.avatar=ac.toDataURL('image/png');assets.avatarFramed=assets.avatar;document.getElementById('portrait-preview').innerHTML='<img alt="立绘预览" src="'+assets.portrait+'">';document.getElementById('avatar-preview').innerHTML='<img alt="头像预览" src="'+assets.avatar+'">';document.getElementById('bg-state').textContent=document.getElementById('remove-bg').checked&&sample?'已扣除采样背景':'保留原始透明';}
canvas.addEventListener('pointerdown',function(e){if(!img)return;var p=point(e);if(sampling){samplePixel(p);sampling=false;document.getElementById('sample-btn').classList.remove('sampling');return;}if(mode==='portrait'){var s=selections.portrait;if(p.x>=s.x&&p.x<=s.x+s.w&&p.y>=s.y&&p.y<=s.y+s.h){drag=true;offX=p.x-s.x;offY=p.y-s.y;}}else{var a=selections.avatar;if(Math.hypot(p.x-a.x,p.y-a.y)<=a.r){drag=true;offX=p.x-a.x;offY=p.y-a.y;}}if(drag)canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',function(e){if(!drag)return;var p=point(e);if(mode==='portrait'){var s=selections.portrait;s.x=clamp(p.x-offX,0,canvas.width-s.w);s.y=clamp(p.y-offY,0,canvas.height-s.h);}else{var a=selections.avatar;a.x=clamp(p.x-offX,a.r,canvas.width-a.r);a.y=clamp(p.y-offY,a.r,canvas.height-a.r);}draw();});
canvas.addEventListener('pointerup',function(){if(drag){drag=false;updatePreviews();}});
function samplePixel(p){var d=bctx.getImageData(clamp(Math.round(p.x),0,base.width-1),clamp(Math.round(p.y),0,base.height-1),1,1).data;if(d[3]===0){sample=null;document.getElementById('swatch').style.background='transparent';document.getElementById('sample-text').textContent='这里已经是透明像素，无需抠除';updatePreviews();return;}sample={r:d[0],g:d[1],b:d[2]};document.getElementById('swatch').style.background='rgba('+d[0]+','+d[1]+','+d[2]+','+(d[3]/255)+')';document.getElementById('sample-text').textContent='已采样 rgb('+d[0]+','+d[1]+','+d[2]+')';updatePreviews();}
canvas.addEventListener('wheel',function(e){if(!img)return;e.preventDefault();var delta=e.deltaY<0?4:-4;sizeInput.value=clamp(+sizeInput.value+delta,+sizeInput.min,+sizeInput.max);resizeSelection(+sizeInput.value);},{passive:false});
function resizeSelection(v){if(!img)return;var ratio=v/100;if(mode==='portrait'){var s=selections.portrait,cx=s.x+s.w/2,cy=s.y+s.h/2,w=Math.min(canvas.width*ratio,canvas.height*ratio*3/4),h=w*4/3;s.w=w;s.h=h;s.x=clamp(cx-w/2,0,canvas.width-w);s.y=clamp(cy-h/2,0,canvas.height-h);}else{var a=selections.avatar,r=Math.min(canvas.width,canvas.height)*ratio/2;a.r=r;a.x=clamp(a.x,r,canvas.width-r);a.y=clamp(a.y,r,canvas.height-r);}document.getElementById('size-val').value=v+'%';draw();updatePreviews();}
document.getElementById('file').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){setImage(i)};i.src=r.result};r.readAsDataURL(f);});
document.querySelectorAll('[data-mode]').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.mode)});});
document.getElementById('center').onclick=centerSelection;sizeInput.oninput=function(){resizeSelection(+this.value)};
document.getElementById('sample-btn').onclick=function(){if(!img){document.getElementById('message').textContent='请先选择原始图片。';return;}document.getElementById('remove-bg').checked=true;sampling=true;this.classList.add('sampling');document.getElementById('sample-text').textContent='正在取色：点击画面中的背景颜色';};
['remove-bg','tolerance','feather'].forEach(function(id){document.getElementById(id).addEventListener('input',function(){if(id==='remove-bg'&&!this.checked){sampling=false;document.getElementById('sample-btn').classList.remove('sampling');document.getElementById('sample-text').textContent=sample?'已保留采样色，重新启用即可应用':'点击吸管后，再点画面取色';}document.getElementById('tol-val').value=document.getElementById('tolerance').value;document.getElementById('feather-val').value=document.getElementById('feather').value;updatePreviews();});});
document.getElementById('next').onclick=function(){setMode(mode==='portrait'?'avatar':'portrait')};
document.getElementById('save').onclick=function(){if(!img)return;updatePreviews();var q=new URLSearchParams(location.search);var id=q.get('id')||'';var system=q.get('system')||'';var adventure=q.get('adventure')||'默认';var result={portrait:assets.portrait,avatarFramed:assets.avatarFramed,updatedAt:Date.now()};var msgEl=document.getElementById('message');function broadcast(r){try{localStorage.setItem('trpg_portrait_result',JSON.stringify(r));localStorage.setItem('trpg_portrait_result_'+id,JSON.stringify(r));}catch(e){}try{if(window.opener&&!window.opener.closed)window.opener.postMessage({type:'trpg_portrait_result',id:id,result:r},location.origin);}catch(e){}try{var bc=new BroadcastChannel('trpg_portrait');bc.postMessage({type:'trpg_portrait_result',id:id,result:r});setTimeout(function(){try{bc.close()}catch(e){}},30);}catch(e){}}
function finish(text){msgEl.textContent=text;setTimeout(function(){window.close();},120);}
if(system&&id){msgEl.textContent='正在保存图片文件…';fetch('/api/assets/character-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:system,adventure:adventure,id:id,images:{portrait:assets.portrait,avatarFramed:assets.avatarFramed}})}).then(function(r){return r.json();}).then(function(d){if(d&&d.images&&d.images.portrait&&d.images.portrait.url){broadcast({portrait:d.images.portrait.url,avatarFramed:d.images.avatarFramed.url,updatedAt:Date.now()});finish('已保存图片文件并关联角色卡。');}else{broadcast(result);finish('保存图片失败：'+(d&&d.error||'未知错误')+'，已降级为本地数据。');}}).catch(function(e){broadcast(result);finish('保存图片失败：'+e.message+'，已降级为本地数据。');});}else{broadcast(result);finish('已保存，角色卡会自动读取新素材。');}};
document.getElementById('close').onclick=function(){window.close()};
try{var src=localStorage.getItem('trpg_portrait_source');if(src){var i=new Image();i.onload=function(){setImage(i)};i.src=src;document.getElementById('source-hint').textContent='已读取角色卡中的原图，也可重新选择';}}catch(e){}
draw();updateSteps();
})();
</script>
</body></html>
