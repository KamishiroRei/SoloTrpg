<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GM 工具</title>
<style>
  :root { color-scheme: dark; --bg:#171a2d; --panel:#202846; --panel2:#182039; --border:#35416a; --text:#eef0ff; --muted:#9ca7c9; --accent:#d2ad45; --accent2:#f0d57a; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:transparent; color:var(--text); font:12px/1.55 system-ui,"Microsoft YaHei",sans-serif; }
  body { padding:12px; }
  button,input { font:inherit; }
  .curtain { min-height:460px; display:flex; align-items:center; justify-content:center; padding:24px; border:1px solid var(--border); border-radius:14px; background:linear-gradient(145deg,rgba(32,40,70,.96),rgba(16,20,38,.98)); text-align:center; }
  .curtain-card { max-width:360px; }
  .curtain-icon { font-size:44px; margin-bottom:12px; }
  .curtain h2 { margin:0 0 8px; font-size:18px; color:var(--accent2); }
  .curtain p { margin:0 0 18px; color:var(--muted); }
  .workspace { display:grid; gap:12px; }
  .section { border:1px solid var(--border); border-radius:12px; background:linear-gradient(145deg,var(--panel),var(--panel2)); overflow:hidden; }
  .section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 12px; border-bottom:1px solid rgba(80,94,143,.45); }
  .section-head h3 { margin:0; font-size:13px; color:var(--accent2); }
  .section-body { padding:12px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; }
  .btn { border:1px solid var(--border); border-radius:7px; padding:7px 11px; color:var(--text); background:#243052; cursor:pointer; }
  .btn:hover { border-color:#6276b2; background:#2b3961; }
  .btn.accent { color:#171a2d; border-color:var(--accent); background:var(--accent); font-weight:700; }
  .btn.danger { border-color:#8d4c61; color:#ffb8c5; }
  .hint { color:var(--muted); margin-top:8px; }
  .gallery-tools { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin-bottom:10px; }
  .search { width:100%; border:1px solid var(--border); border-radius:7px; padding:7px 9px; background:#11172c; color:var(--text); outline:none; }
  .search:focus { border-color:#7085c7; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px; max-height:300px; overflow:auto; padding-right:3px; }
  .media-card { min-width:0; border:1px solid var(--border); border-radius:9px; overflow:hidden; background:#11172c; cursor:pointer; position:relative; }
  .media-card:hover { border-color:#6073ac; transform:translateY(-1px); }
  .media-card.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .media-card img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:repeating-conic-gradient(#22283e 0 25%,#171c30 0 50%) 50%/14px 14px; }
  .media-meta { padding:6px 7px; min-width:0; }
  .media-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .media-module { color:var(--muted); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { grid-column:1/-1; padding:28px 12px; text-align:center; color:var(--muted); border:1px dashed var(--border); border-radius:9px; }
  .selection { display:grid; grid-template-columns:112px minmax(0,1fr); gap:10px; margin-top:11px; padding-top:11px; border-top:1px solid rgba(80,94,143,.4); }
  .selection img { width:112px; height:84px; object-fit:cover; border-radius:8px; border:1px solid var(--border); background:#11172c; }
  .selection-info { min-width:0; display:grid; gap:7px; align-content:start; }
  .selection-path { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .selection-actions { display:flex; flex-wrap:wrap; gap:7px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="gm-curtain" class="curtain" hidden>
  <div class="curtain-card">
    <div class="curtain-icon">🎭</div>
    <h2>GM 帷幕</h2>
    <p id="curtain-text">当前身份是玩家。GM 工具和未公开模组信息不会向玩家开放。</p>
    <button id="become-gm" class="btn accent" hidden>将自己设为真人 GM</button>
  </div>
</div>

<main id="gm-workspace" class="workspace" hidden>
  <section class="section">
    <div class="section-head"><h3>GM 工具</h3><span id="gm-name"></span></div>
    <div class="section-body">
      <div class="toolbar">
        <button class="btn accent" id="btn-check-tool">🎲 发起检定</button>
        <button class="btn" id="btn-gm-ai-gen">🤖 调用 AI 副GM</button>
        <button class="btn danger" id="btn-illustration-clear">⏹ 结束插图</button>
      </div>
      <div class="hint">模组导入与整理统一在「规则」页完成；这里仅保留带团期间需要的 GM 操作。</div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h3>场景插图</h3><span id="media-count" class="hint"></span></div>
    <div class="section-body">
      <div class="gallery-tools">
        <input id="media-search" class="search" placeholder="搜索模组、文件名或路径">
        <button id="media-refresh" class="btn">刷新</button>
      </div>
      <div id="media-gallery" class="gallery"><div class="empty">正在读取模组插图……</div></div>
      <div id="media-selection" class="selection" hidden>
        <img id="selected-preview" alt="已选插图">
        <div class="selection-info">
          <strong id="selected-name"></strong>
          <div id="selected-path" class="selection-path"></div>
          <input id="selected-caption" class="search" placeholder="显示标题（默认使用文件名）">
          <div class="selection-actions">
            <button id="show-selected" class="btn accent">投放到地图区域</button>
            <button id="clear-selected" class="btn">取消选择</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  var host = window.parent;
  var api = host && host.UIManager ? host.UIManager : null;
  var network = host && host.Network ? host.Network : null;
  var system = new URLSearchParams(location.search).get('system') || '';
  var curtain = document.getElementById('gm-curtain');
  var workspace = document.getElementById('gm-workspace');
  var isGM = !!(api && api.isGMUser && api.isGMUser());
  var isHost = !!(api && api.isRoomHost && api.isRoomHost());

  if (!isGM) {
    curtain.hidden = false;
    document.getElementById('curtain-text').textContent = isHost
      ? '你正在承载房间，但当前身份是玩家。承载房间不等于拥有 GM 权限。'
      : '当前身份是玩家。GM 工具和未公开模组信息不会向玩家开放。';
    var become = document.getElementById('become-gm');
    if (isHost && network && network.setRole) {
      become.hidden = false;
      become.addEventListener('click', function () {
        network.setRole('gm', network.getMyName ? network.getMyName() : '');
      });
    }
    return;
  }

  workspace.hidden = false;
  document.getElementById('gm-name').textContent = network && network.getMyName ? network.getMyName() : '真人 GM';
  var checkBtn = document.getElementById('btn-check-tool');
  checkBtn.addEventListener('click', function () {
    if (api && api.openDiceModal) api.openDiceModal();
  });
  document.getElementById('btn-gm-ai-gen').addEventListener('click', function () {
    if (api && api.addChatMessage) api.addChatMessage('system', 'GM工具', '已切换到聊天区。可在设置中选择「AI副GM」，让 AI 检索规则、管理状态、生成候选内容并提醒冲突；真人GM保留最终裁定。');
    try { host.document.getElementById('chat-input').focus(); } catch (e) {}
  });
  document.getElementById('btn-illustration-clear').addEventListener('click', function () {
    if (api && api.hideIllustration) api.hideIllustration();
  });

  var allMedia = [];
  var selected = null;
  var gallery = document.getElementById('media-gallery');
  var search = document.getElementById('media-search');

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];
    });
  }

  function renderMedia() {
    var keyword = search.value.trim().toLowerCase();
    var rows = allMedia.filter(function (item) {
      return !keyword || (item.path + ' ' + item.name + ' ' + item.moduleName).toLowerCase().indexOf(keyword) >= 0;
    });
    document.getElementById('media-count').textContent = rows.length + ' / ' + allMedia.length;
    if (!rows.length) {
      gallery.innerHTML = '<div class="empty">' + (allMedia.length ? '没有符合搜索条件的插图。' : '当前模组没有可用图片。请先在「规则」页导入模组，AI 整理后会建立媒体索引。') + '</div>';
      return;
    }
    gallery.innerHTML = rows.map(function (item) {
      return '<article class="media-card' + (selected && selected.path === item.path ? ' selected' : '') + '" data-path="' + esc(item.path) + '">' +
        '<img loading="lazy" src="' + esc(item.url) + '" alt="' + esc(item.name) + '">' +
        '<div class="media-meta"><div class="media-name" title="' + esc(item.name) + '">' + esc(item.name) + '</div><div class="media-module">' + esc(item.moduleName || '模组') + '</div></div></article>';
    }).join('');
    gallery.querySelectorAll('.media-card').forEach(function (card) {
      card.addEventListener('click', function () {
        selected = allMedia.find(function (item) { return item.path === card.getAttribute('data-path'); }) || null;
        showSelection();
        renderMedia();
      });
    });
  }

  function showSelection() {
    var box = document.getElementById('media-selection');
    box.hidden = !selected;
    if (!selected) return;
    document.getElementById('selected-preview').src = selected.url;
    document.getElementById('selected-name').textContent = selected.name;
    document.getElementById('selected-path').textContent = selected.path;
    document.getElementById('selected-caption').value = selected.name;
  }

  function loadMedia() {
    gallery.innerHTML = '<div class="empty">正在读取模组插图……</div>';
    fetch('/api/module/media?system=' + encodeURIComponent(system) + '&view=gm')
      .then(function (response) { if (!response.ok) throw new Error('读取失败'); return response.json(); })
      .then(function (data) { allMedia = data.images || []; renderMedia(); })
      .catch(function (error) { gallery.innerHTML = '<div class="empty">插图读取失败：' + esc(error.message || '未知错误') + '</div>'; });
  }

  search.addEventListener('input', renderMedia);
  document.getElementById('media-refresh').addEventListener('click', loadMedia);
  document.getElementById('clear-selected').addEventListener('click', function () { selected = null; showSelection(); renderMedia(); });
  document.getElementById('show-selected').addEventListener('click', function () {
    if (!selected || !api || !api.showIllustration) return;
    var caption = document.getElementById('selected-caption').value.trim() || selected.name;
    api.showIllustration(selected.url, caption);
  });
  loadMedia();
})();
</script>
</body>
</html>
